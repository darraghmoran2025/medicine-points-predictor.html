<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAO Medicine Points Pressure Model — 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e2e8f0; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.5; }
    input[type=range] { accent-color: #3b82f6; cursor: pointer; width: 200px; height: 6px; }
    button { cursor: pointer; font-family: inherit; transition: all 0.15s; }

    .hdr { background: #1e293b; border-bottom: 1px solid #334155; padding: 24px 28px 0; }
    .title { font-size: 22px; font-weight: 700; color: #f1f5f9; }
    .sub { font-size: 13px; color: #64748b; margin-top: 4px; }
    .tag { font-size: 11px; letter-spacing: 1px; color: #3b82f6; margin-bottom: 6px; font-weight: 600; }

    .ctrl-row { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; padding: 16px 0; border-top: 1px solid #334155; margin-top: 16px; }
    .ctrl-label { font-size: 11px; color: #64748b; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 6px; }

    .tabs { display: flex; margin-top: 4px; gap: 4px; }
    .tab-btn { background: transparent; border: none; border-bottom: 3px solid transparent; color: #64748b; padding: 10px 20px; font-size: 13px; letter-spacing: 0; text-transform: capitalize; font-weight: 500; }
    .tab-btn:hover { color: #94a3b8; }
    .tab-btn.active { border-bottom-color: #3b82f6; color: #3b82f6; font-weight: 600; }

    .content { padding: 24px 28px; }
    .grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 20px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 16px; }

    .kpi { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 18px 20px; }
    .kpi-label { font-size: 11px; color: #64748b; margin-bottom: 6px; font-weight: 500; }
    .kpi-val { font-size: 28px; font-weight: 700; }
    .kpi-sub { font-size: 11px; color: #475569; margin-top: 4px; }

    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .sec { font-size: 11px; letter-spacing: 0.8px; color: #3b82f6; margin-bottom: 14px; font-weight: 600; text-transform: uppercase; }

    .sc-card { background: #1e293b; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .stat-mini { padding: 10px 12px; background: #0f172a; border-radius: 6px; }
    .stat-mini-label { font-size: 11px; color: #64748b; letter-spacing: 0; margin-bottom: 3px; font-weight: 500; }
    .stat-mini-val { font-size: 16px; font-weight: 700; color: #f1f5f9; }
    .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }

    .p-box { border-radius: 8px; text-align: center; padding: 16px; }
    .p-label { font-size: 11px; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600; }
    .p-big { font-size: 44px; font-weight: 700; line-height: 1; }
    .p-note { font-size: 12px; color: #64748b; margin-top: 6px; }

    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .bar-label { font-size: 12px; color: #94a3b8; min-width: 110px; }
    .bar-track { flex: 1; background: #0f172a; border-radius: 4px; height: 8px; }
    .bar-fill { height: 100%; border-radius: 4px; }
    .bar-val { font-size: 13px; font-weight: 700; min-width: 40px; }

    .verdict-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 12px; }
    .mbox { padding: 14px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; margin-top: 12px; }
    .mbox-label { font-size: 11px; color: #64748b; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 600; }
    .mbox-txt { font-size: 12px; color: #94a3b8; line-height: 1.6; }

    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { text-align: left; padding: 8px 10px; color: #3b82f6; font-size: 11px; letter-spacing: 0.5px; border-bottom: 1px solid #334155; font-weight: 600; }
    .tbl td { padding: 8px 10px; border-bottom: 1px solid #1e293b; }

    .scenario-item { margin-bottom: 12px; padding: 14px; cursor: pointer; border-radius: 8px; border: 1px solid #334155; transition: background 0.15s; }
    .scenario-item:hover { background: rgba(59,130,246,0.06) !important; }

    .meta-row { display: flex; gap: 16px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #1e293b; }
    .meta-k { min-width: 150px; font-size: 12px; font-weight: 600; color: #f59e0b; }
    .meta-v { font-size: 12px; color: #94a3b8; line-height: 1.7; }

    .ol-card { padding: 16px; border-radius: 8px; }
    .ol-row { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

    .hdr-sc { display: flex; gap: 10px; }
    .hdr-sc-box { padding: 10px 18px; text-align: center; cursor: pointer; border-radius: 10px; transition: all 0.15s; }
    .hdr-sc-box:hover { transform: translateY(-1px); }

    .stat-row { display: flex; gap: 24px; margin-left: auto; }
    .stat-item { text-align: right; }
    .stat-lbl { font-size: 10px; letter-spacing: 0.5px; color: #64748b; font-weight: 500; margin-bottom: 2px; }
    .stat-val { font-size: 18px; font-weight: 700; }

    .ul-btns { display: flex; gap: 8px; }
    .ul-btn { padding: 7px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .ul-btn:hover { filter: brightness(1.15); }

    @media(max-width:600px){
      .grid4{grid-template-columns:1fr 1fr}
      .grid3{grid-template-columns:1fr}
      .grid2{grid-template-columns:1fr}
      .stat-row{display:none}
      .hdr-sc{flex-wrap:wrap}
      .content{padding:16px}
      .hdr{padding:16px 16px 0}
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const HISTORY = [
  {year:2017,ucd:730,tcd:728,rcsi:725,ucc:722,nuig:718,avg:724.6,app:2100},
  {year:2018,ucd:732,tcd:730,rcsi:727,ucc:724,nuig:720,avg:726.6,app:2180},
  {year:2019,ucd:735,tcd:732,rcsi:729,ucc:729,nuig:726,avg:730.2,app:2280},
  {year:2020,ucd:737,tcd:735,rcsi:733,ucc:731,nuig:728,avg:732.8,app:2340},
  {year:2021,ucd:755,tcd:752,rcsi:749,ucc:747,nuig:742,avg:749.0,app:2850,note:'COVID grades'},
  {year:2022,ucd:743,tcd:743,rcsi:740,ucc:738,nuig:735,avg:739.8,app:2500},
  {year:2023,ucd:741,tcd:740,rcsi:737,ucc:735,nuig:732,avg:737.0,app:2460,note:'+60 places'},
  {year:2024,ucd:739,tcd:737,rcsi:733,ucc:731,nuig:729,avg:733.8,app:2440},
  {year:2025,ucd:737,tcd:735,rcsi:733,ucc:730,nuig:728,avg:732.6,app:2420},
];
const TOTAL=483,LRM=733,CUR=732.6,CDEV=CUR-LRM;
const UL=[
  {label:'Conservative',sub:'30 places',places:30,color:'#f59e0b'},
  {label:'Base Case',sub:'50 places',places:50,color:'#3b82f6'},
  {label:'Aggressive',sub:'75 places',places:75,color:'#ef4444'},
];

function sig(x){return 1/(1+Math.exp(-8*x));}
function calc(d,u){
  const relief=u/TOTAL,net=d-relief,raw=net*100*1.8,mr=raw-0.35*CDEV;
  return {relief,net,raw,mr,proj:+(CUR+mr).toFixed(1),p:sig(net)};
}

let state={d:0.20,ui:1,tab:'overview'};

function render(){
  const {d,ui,tab}=state;
  const sc=UL.map(s=>({...s,...calc(d,s.places)}));
  const act=sc[ui];
  const newApp=Math.round(2420*(1+d));
  const newTot=TOTAL+UL[ui].places;

  let html=`
  <div class="hdr">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px">
      <div>
        <div class="tag">LC MEDICINE ADMISSIONS · IRELAND</div>
        <div class="title">CAO Points Pressure Model — 2026</div>
        <div class="sub">Demand shock + UL supply offset + Ornstein-Uhlenbeck mean reversion</div>
      </div>
      <div class="hdr-sc">
        ${sc.map((s,i)=>`
          <div class="hdr-sc-box" onclick="setState({ui:${i}})"
            style="background:${i===ui?s.color+'22':'rgba(255,255,255,0.03)'};border:1px solid ${i===ui?s.color:'#334155'}">
            <div style="font-size:10px;letter-spacing:1px;color:${s.color};margin-bottom:4px;font-weight:600">${s.label.toUpperCase()}</div>
            <div style="font-size:26px;font-weight:700;color:${s.p>0.55?'#ef4444':'#10b981'};line-height:1">${Math.round(s.p*100)}%</div>
            <div style="font-size:11px;color:#64748b;margin-top:3px">P(rise)</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="ctrl-row">
      <div>
        <div class="ctrl-label">DEMAND INCREASE</div>
        <div style="display:flex;align-items:center;gap:12px">
          <input type="range" min="0" max="0.5" step="0.01" value="${d}" oninput="setState({d:+this.value})">
          <span style="font-weight:700;color:#f1f5f9;font-size:17px;min-width:48px">+${Math.round(d*100)}%</span>
        </div>
      </div>
      <div>
        <div class="ctrl-label">UL CAPACITY SCENARIO</div>
        <div class="ul-btns">
          ${UL.map((s,i)=>`
            <button class="ul-btn" onclick="setState({ui:${i}})"
              style="background:${ui===i?s.color:'transparent'};border:1px solid ${s.color};color:${ui===i?'#000':s.color}">
              ${s.sub}
            </button>`).join('')}
        </div>
      </div>
      <div class="stat-row">
        ${[['NET PRESSURE',(act.net*100).toFixed(1)+'%',act.net>0?'#ef4444':'#10b981'],
           ['PROJECTED AVG',act.proj.toFixed(1),'#f1f5f9'],
           ['Δ POINTS (MR)',(act.mr>=0?'+':'')+act.mr.toFixed(1),act.mr>0?'#ef4444':'#10b981'],
           ['S/D RATIO',(newApp/newTot).toFixed(2)+'x','#f59e0b']
          ].map(([l,v,c])=>`
          <div class="stat-item">
            <div class="stat-lbl">${l}</div>
            <div class="stat-val" style="color:${c}">${v}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="tabs">
      ${['overview','historical','scenarios','likelihood'].map(t=>`
        <button class="tab-btn ${tab===t?'active':''}" onclick="setState({tab:'${t}'})">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}
    </div>
  </div>
  <div class="content">`;

  if(tab==='overview'){
    html+=`
    <div class="grid4">
      ${[['2025 Avg Points','732.6','5-school combined','#3b82f6'],
         ['Projected Applicants',newApp.toLocaleString(),'+'+(newApp-2420)+' vs 2025','#f59e0b'],
         ['Total Places After UL',newTot,UL[ui].label+': +'+UL[ui].places+' places','#10b981'],
         ['MR-Adjusted Δ Points',(act.mr>=0?'+':'')+act.mr.toFixed(1),'After OU adjustment',act.mr>0?'#ef4444':'#10b981'],
        ].map(([l,v,s,c])=>`
        <div class="kpi" style="border-top:3px solid ${c}">
          <div class="kpi-label">${l}</div>
          <div class="kpi-val" style="color:${c}">${v}</div>
          <div class="kpi-sub">${s}</div>
        </div>`).join('')}
    </div>
    <div class="grid2">
      <div class="card">
        <div class="sec">Combined LC+HPAT Points by Institution (2017–2025)</div>
        <canvas id="lineChart" height="200"></canvas>
        <div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap">
          ${[['UCD','#4a9eff'],['TCD','#f59e0b'],['RCSI','#ef4444'],['UCC','#10b981'],['NUIG','#a78bfa'],['Avg','#f1f5f9']].map(([l,c])=>`
            <div style="display:flex;align-items:center;gap:6px">
              <div style="width:14px;height:2px;background:${c};border-radius:1px"></div>
              <span style="font-size:11px;color:#94a3b8">${l}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="sec">2026 Scenario Projections</div>
        ${sc.map((s,i)=>`
          <div class="scenario-item" onclick="setState({ui:${i}})"
            style="border-left:3px solid ${s.color};border-color:${i===ui?s.color:'#334155'};background:${i===ui?s.color+'12':'transparent'}">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px;align-items:center">
              <span style="font-size:13px;font-weight:600;color:${s.color}">${s.label} <span style="font-weight:400;color:#64748b;font-size:12px">(${s.sub})</span></span>
              <span style="font-size:13px;font-weight:700;color:${s.p>0.5?'#ef4444':'#10b981'}">P = ${Math.round(s.p*100)}%</span>
            </div>
            <div style="display:flex;gap:20px">
              ${[['Projected',s.proj.toFixed(1)],['Δ Points',(s.mr>=0?'+':'')+s.mr.toFixed(1)],['Net Pressure',(s.net*100).toFixed(1)+'%']].map(([l,v])=>`
                <div>
                  <div style="font-size:10px;color:#64748b;margin-bottom:2px">${l}</div>
                  <div style="font-size:14px;font-weight:700;color:#f1f5f9">${v}</div>
                </div>`).join('')}
            </div>
          </div>`).join('')}
        <div class="mbox">
          <div class="mbox-label">OU MEAN REVERSION</div>
          <div class="mbox-txt">Deviation from long-run mean: <span style="color:${CDEV<0?'#10b981':'#ef4444'};font-weight:600">${CDEV.toFixed(1)} pts</span> · θ = 0.35 · Adjustment: <span style="color:#f59e0b;font-weight:600">${(-0.35*CDEV).toFixed(1)} pts</span></div>
        </div>
      </div>
    </div>`;
  }

  if(tab==='historical'){
    html+=`
    <div class="grid2">
      <div class="card">
        <div class="sec">HPAT Applicant Demand (2017–2026 Projected)</div>
        <canvas id="demChart" height="180"></canvas>
      </div>
      <div class="card">
        <div class="sec">Year-on-Year Points Change — 5-School Average</div>
        <canvas id="deltaChart" height="180"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="sec">Raw Data — Minimum Combined Points by Institution</div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>${['Year','UCD','TCD','RCSI','UCC','NUIG','Avg','YoY Δ','Notes'].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>
            ${HISTORY.map((h,i)=>{
              const delta=i>0?h.avg-HISTORY[i-1].avg:null;
              const dc=delta===null?'#64748b':delta>0?'#ef4444':'#10b981';
              return `<tr style="background:${h.note?'rgba(245,158,11,0.04)':'transparent'}">
                <td style="font-weight:700;color:#f1f5f9">${h.year}</td>
                ${[h.ucd,h.tcd,h.rcsi,h.ucc,h.nuig].map(v=>`<td style="color:#94a3b8">${v}</td>`).join('')}
                <td style="color:#f59e0b;font-weight:700">${h.avg}</td>
                <td style="font-weight:700;color:${dc}">${delta===null?'—':(delta>0?'+':'')+delta.toFixed(1)}</td>
                <td style="color:#64748b;font-style:italic">${h.note||''}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  if(tab==='scenarios'){
    html+=`
    <div class="grid3">
      ${sc.map((s,i)=>`
        <div class="sc-card" style="border:1px solid ${s.color}">
          <div style="font-size:11px;letter-spacing:1px;color:${s.color};margin-bottom:14px;font-weight:600">${s.label.toUpperCase()} — ${s.sub}</div>
          <div class="mini-grid">
            ${[['UL Places',s.places],['Total Supply',TOTAL+s.places],
               ['Supply Relief',(s.relief*100).toFixed(1)+'%'],['Net Pressure',(s.net*100).toFixed(1)+'%'],
               ['Raw Δ Pts',(s.raw>=0?'+':'')+s.raw.toFixed(1)],['MR Adj',(-0.35*CDEV).toFixed(1)],
               ['Final Δ',(s.mr>=0?'+':'')+s.mr.toFixed(1)],['Projected',s.proj.toFixed(1)]
              ].map(([l,v])=>`
              <div class="stat-mini">
                <div class="stat-mini-label">${l}</div>
                <div class="stat-mini-val">${v}</div>
              </div>`).join('')}
          </div>
          <div class="p-box" style="background:${s.color}15">
            <div class="p-label" style="color:${s.color}">P(POINTS RISE)</div>
            <div class="p-big" style="color:${s.color}">${Math.round(s.p*100)}%</div>
            <div class="p-note">${s.p>0.65?'▲ Rise likely':s.p>0.45?'→ Marginal':'▼ Fall possible'}</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="sec">Methodology</div>
      ${[['Demand Model','+'+Math.round(d*100)+'% applied to 2025 baseline 2,420 HPAT applicants → '+newApp.toLocaleString()+' projected'],
         ['Supply Relief','UL places as % of current national total (483). Linear offset applied to demand pressure.'],
         ['Points Sensitivity','~1.8 combined pts per 1% net pressure. Calibrated from 2017–2020 + 2022–2025 regression. COVID 2021 excluded.'],
         ['Mean Reversion (OU)','θ=0.35. Current deviation from LR mean (733): '+CDEV.toFixed(1)+' pts. Adj: '+(-0.35*CDEV).toFixed(1)+' pts.'],
         ['Likelihood Ratio','Logistic sigmoid P(rise)=1/(1+e^(−8×net)). Scale k=8 calibrated to 710–755 range.'],
         ['COVID 2021','+16pt spike from accredited grades. Structural outlier — excluded from regression.'],
        ].map(([k,v])=>`
        <div class="meta-row"><div class="meta-k">${k}</div><div class="meta-v">${v}</div></div>`).join('')}
    </div>`;
  }

  if(tab==='likelihood'){
    const maxRatio=Math.max(2420/TOTAL,...sc.map(s=>newApp/(TOTAL+s.places)));
    html+=`
    <div class="grid2">
      <div class="card">
        <div class="sec">P(Rise) vs P(Stable/Fall) by Scenario</div>
        <canvas id="likeChart" height="180"></canvas>
      </div>
      <div class="card">
        <div class="sec">Supply/Demand Compression Ratio</div>
        <div style="font-size:12px;color:#64748b;margin-bottom:14px">Applicants per available place</div>
        ${[{label:'2025 Baseline',r:2420/TOTAL,c:'#475569'},...sc.map(s=>({label:s.label,r:newApp/(TOTAL+s.places),c:s.color}))].map(item=>`
          <div class="bar-row">
            <span class="bar-label">${item.label}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(item.r/maxRatio*100)}%;background:${item.c}"></div></div>
            <span class="bar-val" style="color:${item.c}">${item.r.toFixed(2)}x</span>
          </div>`).join('')}
        <div class="mbox">
          <div class="mbox-label">VERDICT MATRIX</div>
          ${sc.map(s=>`
            <div class="verdict-row">
              <span style="color:${s.color};font-weight:600">${s.label}</span>
              <span style="font-weight:700;color:${s.mr>1?'#ef4444':s.mr>-1?'#f59e0b':'#10b981'}">
                ${s.mr>1?'▲ RISE LIKELY':s.mr>-1?'→ FLAT / MARGINAL':'▼ FALL POSSIBLE'}
              </span>
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="sec">Outlier Analysis — Boundary Conditions</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
        ${[{label:'Bull',desc:'+30% / 30 pl',d2:0.30,u2:30,c:'#ef4444'},
           {label:'Base',desc:'+20% / 50 pl',d2:0.20,u2:50,c:'#3b82f6'},
           {label:'Bear',desc:'+10% / 75 pl',d2:0.10,u2:75,c:'#10b981'},
           {label:'Outlier',desc:'+40% / 30 pl',d2:0.40,u2:30,c:'#a78bfa'},
          ].map(o=>{
            const m=calc(o.d2,o.u2);
            return `<div class="ol-card" style="border:1px solid ${o.c};background:${o.c}0d">
              <div style="font-weight:700;color:${o.c};font-size:13px;margin-bottom:2px">${o.label}</div>
              <div style="font-size:11px;color:#64748b;margin-bottom:10px">${o.desc}</div>
              ${[['Net Pressure',(m.net*100).toFixed(1)+'%'],
                 ['Raw Δ Pts',(m.raw>=0?'+':'')+m.raw.toFixed(1)],
                 ['MR Δ Pts',(m.mr>=0?'+':'')+m.mr.toFixed(1)],
                 ['Projected',m.proj.toFixed(1)],
                 ['P(Rise)',Math.round(m.p*100)+'%'],
                ].map(([l,v])=>`
                <div class="ol-row">
                  <span style="color:#64748b">${l}</span>
                  <span style="color:#f1f5f9;font-weight:700">${v}</span>
                </div>`).join('')}
            </div>`;
          }).join('')}
      </div>
    </div>`;
  }

  html+='</div>';
  document.getElementById('app').innerHTML=html;

  // Draw charts
  if(tab==='overview') drawLineChart(d);
  if(tab==='historical') { drawDemChart(newApp); drawDeltaChart(); }
  if(tab==='likelihood') drawLikeChart(sc);
}

function drawLineChart(d){
  const sc=UL.map(s=>({...s,...calc(d,s.places)}));
  const c=document.getElementById('lineChart');
  if(!c)return;
  const ctx=c.getContext('2d');
  const W=c.offsetWidth||c.parentElement.offsetWidth;
  c.width=W; c.height=200;
  const pad={t:10,r:10,b:30,l:40};
  const iw=W-pad.l-pad.r,ih=200-pad.t-pad.b;
  const years=HISTORY.map(h=>h.year);
  const minY=710,maxY=760;
  const xS=i=>pad.l+i/(years.length-1)*iw;
  const yS=v=>pad.t+(1-(v-minY)/(maxY-minY))*ih;

  ctx.clearRect(0,0,W,200);
  ctx.strokeStyle='#1e3a5f'; ctx.lineWidth=0.5;
  [720,730,740,750].forEach(v=>{
    ctx.beginPath();ctx.moveTo(pad.l,yS(v));ctx.lineTo(pad.l+iw,yS(v));ctx.stroke();
  });

  // LR mean
  ctx.strokeStyle='#3b82f6'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(pad.l,yS(733));ctx.lineTo(pad.l+iw,yS(733));ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#3b82f6'; ctx.font='9px monospace';
  ctx.fillText('LR 733',pad.l+iw-40,yS(733)-4);

  const series=[['ucd','#4a9eff'],['tcd','#f59e0b'],['rcsi','#ef4444'],['ucc','#10b981'],['nuig','#a78bfa']];
  series.forEach(([k,col])=>{
    ctx.strokeStyle=col; ctx.lineWidth=1.2;
    ctx.beginPath();
    HISTORY.forEach((h,i)=>{ i===0?ctx.moveTo(xS(i),yS(h[k])):ctx.lineTo(xS(i),yS(h[k])); });
    ctx.stroke();
  });

  ctx.strokeStyle='#fff'; ctx.lineWidth=2.5;
  ctx.beginPath();
  HISTORY.forEach((h,i)=>{ i===0?ctx.moveTo(xS(i),yS(h.avg)):ctx.lineTo(xS(i),yS(h.avg)); });
  ctx.stroke();
  HISTORY.forEach((h,i)=>{ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(xS(i),yS(h.avg),3,0,Math.PI*2);ctx.fill(); });

  ctx.fillStyle='#4b5563'; ctx.font='9px monospace'; ctx.textAlign='center';
  years.forEach((y,i)=>ctx.fillText(y,xS(i),200-pad.b+14));
  ctx.textAlign='right';
  [720,730,740,750].forEach(v=>ctx.fillText(v,pad.l-4,yS(v)+3));
}

function drawDemChart(newApp){
  const c=document.getElementById('demChart');
  if(!c)return;
  const data=[...HISTORY.map(h=>({year:h.year,v:h.app})),{year:2026,v:newApp}];
  const W=c.offsetWidth||c.parentElement.offsetWidth;
  c.width=W; c.height=180;
  const ctx=c.getContext('2d');
  const pad={t:10,r:10,b:28,l:45};
  const iw=W-pad.l-pad.r,ih=180-pad.t-pad.b;
  const maxV=Math.max(...data.map(d=>d.v))*1.1;
  const bw=iw/data.length*0.7;
  ctx.clearRect(0,0,W,180);
  data.forEach((d,i)=>{
    const x=pad.l+i/data.length*iw+iw/data.length*0.15;
    const h=d.v/maxV*ih;
    ctx.fillStyle=d.year===2026?'#3b82f680':'#3b82f6';
    ctx.beginPath();
    ctx.roundRect(x,pad.t+ih-h,bw,h,3);
    ctx.fill();
    ctx.fillStyle='#4b5563'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText(d.year,x+bw/2,180-pad.b+14);
  });
  ctx.fillStyle='#4b5563'; ctx.font='9px monospace'; ctx.textAlign='right';
  [1000,2000,3000].forEach(v=>{ if(v<=maxV){ ctx.fillText(v,pad.l-4,pad.t+ih-v/maxV*ih+3); }});
}

function drawDeltaChart(){
  const c=document.getElementById('deltaChart');
  if(!c)return;
  const data=HISTORY.slice(1).map((h,i)=>({year:h.year,v:+(h.avg-HISTORY[i].avg).toFixed(1)}));
  const W=c.offsetWidth||c.parentElement.offsetWidth;
  c.width=W; c.height=180;
  const ctx=c.getContext('2d');
  const pad={t:10,r:10,b:28,l:40};
  const iw=W-pad.l-pad.r,ih=180-pad.t-pad.b;
  const maxV=Math.max(...data.map(d=>Math.abs(d.v)))*1.3||5;
  const zero=pad.t+ih/2;
  const bw=iw/data.length*0.7;
  ctx.clearRect(0,0,W,180);
  ctx.strokeStyle='#3b82f6'; ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(pad.l,zero);ctx.lineTo(pad.l+iw,zero);ctx.stroke();
  data.forEach((d,i)=>{
    const x=pad.l+i/data.length*iw+iw/data.length*0.15;
    const h=Math.abs(d.v)/maxV*(ih/2);
    ctx.fillStyle=d.v>0?'#ef4444':'#10b981';
    if(d.v>0){ ctx.beginPath();ctx.roundRect(x,zero-h,bw,h,3);ctx.fill(); }
    else{ ctx.beginPath();ctx.roundRect(x,zero,bw,h,3);ctx.fill(); }
    ctx.fillStyle='#4b5563'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText(d.year,x+bw/2,180-pad.b+14);
  });
}

function drawLikeChart(sc){
  const c=document.getElementById('likeChart');
  if(!c)return;
  const W=c.offsetWidth||c.parentElement.offsetWidth;
  c.width=W; c.height=180;
  const ctx=c.getContext('2d');
  const pad={t:10,r:10,b:10,l:100};
  const iw=W-pad.l-pad.r,ih=180-pad.t-pad.b;
  const bh=ih/sc.length*0.5;
  ctx.clearRect(0,0,W,180);
  ctx.strokeStyle='#3b82f6'; ctx.lineWidth=0.5; ctx.setLineDash([4,4]);
  const x50=pad.l+iw*0.5;
  ctx.beginPath();ctx.moveTo(x50,pad.t);ctx.lineTo(x50,pad.t+ih);ctx.stroke();
  ctx.setLineDash([]);
  sc.forEach((s,i)=>{
    const y=pad.t+i/sc.length*ih+ih/sc.length*0.25;
    const rw=iw*Math.round(s.p*100)/100;
    const sw=iw*Math.round((1-s.p)*100)/100;
    ctx.fillStyle='#ef4444'; ctx.beginPath();ctx.roundRect(pad.l,y,rw,bh,[0,3,3,0]);ctx.fill();
    ctx.fillStyle='#10b981'; ctx.beginPath();ctx.roundRect(pad.l+rw,y,sw,bh,[3,0,0,3]);ctx.fill();
    ctx.fillStyle='#94a3b8'; ctx.font='10px monospace'; ctx.textAlign='right';
    ctx.fillText(s.label,pad.l-8,y+bh/2+4);
    ctx.fillStyle='#fff'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText(Math.round(s.p*100)+'%',pad.l+rw/2,y+bh/2+4);
  });
  ctx.fillStyle='#4b5563'; ctx.font='9px monospace'; ctx.textAlign='center';
  [0,25,50,75,100].forEach(v=>ctx.fillText(v+'%',pad.l+iw*v/100,180));
}

function setState(patch){
  state={...state,...patch};
  render();
}

render();
</script>
