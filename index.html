<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAO Medicine Points Pressure Model — 2026</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060b16; color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 12px; }
    input[type=range] { accent-color: #3b82f6; cursor: pointer; }
    button { cursor: pointer; font-family: inherit; }
    table { border-collapse: collapse; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { useState } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
            ReferenceLine, BarChart, Bar } = Recharts;

    const HISTORY = [
      { year:2017, ucd:730, tcd:728, rcsi:725, ucc:722, nuig:718, avg:724.6, applicants:2100 },
      { year:2018, ucd:732, tcd:730, rcsi:727, ucc:724, nuig:720, avg:726.6, applicants:2180 },
      { year:2019, ucd:735, tcd:732, rcsi:729, ucc:729, nuig:726, avg:730.2, applicants:2280 },
      { year:2020, ucd:737, tcd:735, rcsi:733, ucc:731, nuig:728, avg:732.8, applicants:2340 },
      { year:2021, ucd:755, tcd:752, rcsi:749, ucc:747, nuig:742, avg:749.0, applicants:2850, note:'COVID grades' },
      { year:2022, ucd:743, tcd:743, rcsi:740, ucc:738, nuig:735, avg:739.8, applicants:2500 },
      { year:2023, ucd:741, tcd:740, rcsi:737, ucc:735, nuig:732, avg:737.0, applicants:2460, note:'+60 places' },
      { year:2024, ucd:739, tcd:737, rcsi:733, ucc:731, nuig:729, avg:733.8, applicants:2440 },
      { year:2025, ucd:737, tcd:735, rcsi:733, ucc:730, nuig:728, avg:732.6, applicants:2420 },
    ];

    const TOTAL_PLACES = 483;
    const LR_MEAN = 733;
    const CUR_PTS = 732.6;
    const CUR_DEV = CUR_PTS - LR_MEAN;

    const UL = [
      { label:'Conservative', sub:'30 places', places:30, color:'#f59e0b' },
      { label:'Base Case',    sub:'50 places', places:50, color:'#3b82f6' },
      { label:'Aggressive',  sub:'75 places', places:75, color:'#ef4444' },
    ];

    function sig(x) { return 1 / (1 + Math.exp(-8 * x)); }

    function calc(demandInc, ulPlaces) {
      const relief = ulPlaces / TOTAL_PLACES;
      const net = demandInc - relief;
      const raw = net * 100 * 1.8;
      const mr = raw - 0.35 * CUR_DEV;
      return { relief, net, raw, mr, proj: +(CUR_PTS + mr).toFixed(1), p: sig(net) };
    }

    const TT = (props) => React.createElement(Tooltip, {
      ...props,
      contentStyle: { background:'#0a1020', border:'1px solid #162035', borderRadius:'6px', fontSize:11 }
    });

    function App() {
      const [d, setD] = useState(0.20);
      const [ui, setUi] = useState(1);
      const [tab, setTab] = useState('overview');

      const sc = UL.map(s => ({ ...s, ...calc(d, s.places) }));
      const act = sc[ui];
      const newApp = Math.round(2420 * (1 + d));
      const newTot = TOTAL_PLACES + UL[ui].places;

      const demChart = [
        ...HISTORY.map(h => ({ year: h.year, v: h.applicants })),
        { year: 2026, v: newApp },
      ];
      const deltaChart = HISTORY.slice(1).map((h, i) => ({
        year: h.year,
        delta: +(h.avg - HISTORY[i].avg).toFixed(1),
      }));

      const card = (children, extra) =>
        React.createElement('div', {
          style: { background:'#0a1020', border:'1px solid #162035', borderRadius:8,
                   padding:18, ...extra }
        }, children);

      const secLabel = (txt) =>
        React.createElement('div', {
          style: { fontSize:8, letterSpacing:3, color:'#3b82f6', marginBottom:12 }
        }, txt);

      return React.createElement('div', { style:{ minHeight:'100vh' } },

        /* ── HEADER ── */
        React.createElement('div', { style:{ background:'#0a1320', borderBottom:'1px solid #162035', padding:'20px 24px 0' } },
          React.createElement('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:10, marginBottom:16 } },
            React.createElement('div', null,
              React.createElement('div', { style:{ fontSize:9, letterSpacing:4, color:'#3b82f6', marginBottom:4 } }, 'LC MEDICINE ADMISSIONS · IRELAND'),
              React.createElement('div', { style:{ fontSize:20, fontWeight:700, color:'#fff' } }, 'CAO Points Pressure Model — 2026'),
              React.createElement('div', { style:{ fontSize:10, color:'#374151', marginTop:2 } }, 'Demand shock + UL supply offset + Ornstein-Uhlenbeck mean reversion'),
            ),
            React.createElement('div', { style:{ display:'flex', gap:10 } },
              sc.map((s, i) =>
                React.createElement('div', {
                  key:i, onClick:() => setUi(i),
                  style:{ padding:'8px 14px', textAlign:'center', cursor:'pointer',
                          background: i===ui ? s.color+'18' : 'transparent',
                          border:`1px solid ${i===ui ? s.color : '#1e3a5f'}`, borderRadius:8 }
                },
                  React.createElement('div', { style:{ fontSize:8, letterSpacing:2, color:s.color, marginBottom:2 } }, s.label.toUpperCase()),
                  React.createElement('div', { style:{ fontSize:22, fontWeight:700, color: s.p>0.55?'#ef4444':'#10b981' } }, Math.round(s.p*100)+'%'),
                  React.createElement('div', { style:{ fontSize:8, color:'#4b5563' } }, 'P(rise)'),
                )
              )
            ),
          ),

          /* Controls */
          React.createElement('div', { style:{ display:'flex', alignItems:'center', gap:24, flexWrap:'wrap', padding:'10px 0', borderTop:'1px solid #162035' } },
            React.createElement('div', null,
              React.createElement('div', { style:{ fontSize:8, letterSpacing:3, color:'#3b82f6', marginBottom:4 } }, 'DEMAND INCREASE'),
              React.createElement('div', { style:{ display:'flex', alignItems:'center', gap:8 } },
                React.createElement('input', { type:'range', min:0, max:0.5, step:0.01, value:d, onChange: e => setD(+e.target.value), style:{ width:110 } }),
                React.createElement('span', { style:{ fontWeight:700, color:'#fff', fontSize:15 } }, '+'+Math.round(d*100)+'%'),
              ),
            ),
            React.createElement('div', null,
              React.createElement('div', { style:{ fontSize:8, letterSpacing:3, color:'#3b82f6', marginBottom:4 } }, 'UL CAPACITY'),
              React.createElement('div', { style:{ display:'flex', gap:6 } },
                UL.map((s, i) =>
                  React.createElement('button', {
                    key:i, onClick:() => setUi(i),
                    style:{ padding:'3px 9px', background: ui===i ? s.color : 'transparent',
                            border:`1px solid ${s.color}`, borderRadius:4,
                            color: ui===i ? '#000' : s.color, fontSize:10, fontWeight:700 }
                  }, s.sub)
                )
              ),
            ),
            React.createElement('div', { style:{ marginLeft:'auto', display:'flex', gap:20 } },
              [
                ['NET PRESSURE', (act.net*100).toFixed(1)+'%', act.net>0?'#ef4444':'#10b981'],
                ['PROJECTED AVG', act.proj.toFixed(1), '#fff'],
                ['Δ POINTS (MR)', (act.mr>=0?'+':'')+act.mr.toFixed(1), act.mr>0?'#ef4444':'#10b981'],
                ['S/D RATIO', (newApp/newTot).toFixed(2)+'x', '#f59e0b'],
              ].map(([l,v,c]) =>
                React.createElement('div', { key:l, style:{ textAlign:'right' } },
                  React.createElement('div', { style:{ fontSize:8, letterSpacing:2, color:'#4b5563' } }, l),
                  React.createElement('div', { style:{ fontSize:17, fontWeight:700, color:c } }, v),
                )
              )
            ),
          ),

          /* Tabs */
          React.createElement('div', { style:{ display:'flex' } },
            ['overview','historical','scenarios','likelihood'].map(t =>
              React.createElement('button', {
                key:t, onClick:() => setTab(t),
                style:{ background:'transparent', border:'none',
                        borderBottom: tab===t ? '2px solid #3b82f6' : '2px solid transparent',
                        color: tab===t ? '#3b82f6' : '#4b5563',
                        padding:'7px 16px', fontSize:10, letterSpacing:2, textTransform:'uppercase' }
              }, t)
            )
          ),
        ),

        /* ── CONTENT ── */
        React.createElement('div', { style:{ padding:'20px 24px' } },

          /* OVERVIEW */
          tab === 'overview' && React.createElement('div', null,
            React.createElement('div', { style:{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12, marginBottom:16 } },
              [
                ['2025 Avg Points','732.6','5-school combined','#3b82f6'],
                ['Projected Applicants', newApp.toLocaleString(), '+'+(newApp-2420)+' vs 2025','#f59e0b'],
                ['Total Places After UL', newTot, UL[ui].label+': '+UL[ui].places+' added','#10b981'],
                ['MR-Adjusted Δ Points', (act.mr>=0?'+':'')+act.mr.toFixed(1), 'After OU adjustment', act.mr>0?'#ef4444':'#10b981'],
              ].map(([l,v,s,c]) =>
                React.createElement('div', { key:l, style:{ background:'#0a1020', border:'1px solid #162035', borderTop:'3px solid '+c, borderRadius:8, padding:14 } },
                  React.createElement('div', { style:{ fontSize:8, letterSpacing:2, color:'#4b5563', marginBottom:4 } }, l),
                  React.createElement('div', { style:{ fontSize:22, fontWeight:700, color:c } }, v),
                  React.createElement('div', { style:{ fontSize:9, color:'#374151', marginTop:3 } }, s),
                )
              )
            ),
            React.createElement('div', { style:{ display:'grid', gridTemplateColumns:'1.6fr 1fr', gap:12 } },
              card(
                [
                  secLabel('COMBINED LC+HPAT POINTS BY INSTITUTION (2017–2025)'),
                  React.createElement(ResponsiveContainer, { width:'100%', height:220 },
                    React.createElement(LineChart, { data:HISTORY },
                      React.createElement(CartesianGrid, { strokeDasharray:'3 3', stroke:'#162035' }),
                      React.createElement(XAxis, { dataKey:'year', tick:{ fill:'#4b5563', fontSize:9 } }),
                      React.createElement(YAxis, { domain:[710,760], tick:{ fill:'#4b5563', fontSize:9 } }),
                      React.createElement(TT),
                      React.createElement(ReferenceLine, { y:LR_MEAN, stroke:'#3b82f6', strokeDasharray:'4 4', label:{ value:'LR Mean 733', fill:'#3b82f6', fontSize:8 } }),
                      ...[['ucd','#4a9eff'],['tcd','#f59e0b'],['rcsi','#ef4444'],['ucc','#10b981'],['nuig','#a78bfa']].map(([k,c]) =>
                        React.createElement(Line, { key:k, type:'monotone', dataKey:k, stroke:c, strokeWidth:1.2, dot:false, name:k.toUpperCase() })
                      ),
                      React.createElement(Line, { type:'monotone', dataKey:'avg', stroke:'#fff', strokeWidth:2.5, dot:{ fill:'#fff', r:3 }, name:'5-Sch Avg' }),
                    )
                  ),
                  React.createElement('div', { style:{ display:'flex', gap:12, marginTop:8, flexWrap:'wrap' } },
                    [['UCD','#4a9eff'],['TCD','#f59e0b'],['RCSI','#ef4444'],['UCC','#10b981'],['NUIG','#a78bfa'],['Avg','#fff']].map(([l,c]) =>
                      React.createElement('div', { key:l, style:{ display:'flex', alignItems:'center', gap:4 } },
                        React.createElement('div', { style:{ width:12, height:2, background:c } }),
                        React.createElement('span', { style:{ fontSize:9, color:'#4b5563' } }, l),
                      )
                    )
                  ),
                ]
              ),
              card(
                [
                  secLabel('2026 SCENARIO PROJECTIONS'),
                  ...sc.map((s,i) =>
                    React.createElement('div', {
                      key:i, onClick:() => setUi(i),
                      style:{ marginBottom:10, padding:10, cursor:'pointer',
                              background: i===ui ? s.color+'0d' : 'transparent',
                              border:`1px solid ${i===ui ? s.color : '#162035'}`,
                              borderLeft:`3px solid ${s.color}`, borderRadius:4 }
                    },
                      React.createElement('div', { style:{ display:'flex', justifyContent:'space-between', marginBottom:5 } },
                        React.createElement('span', { style:{ fontSize:10, fontWeight:700, color:s.color } }, s.label+' ('+s.sub+')'),
                        React.createElement('span', { style:{ fontSize:10, fontWeight:700, color: s.p>0.5?'#ef4444':'#10b981' } }, 'P='+Math.round(s.p*100)+'%'),
                      ),
                      React.createElement('div', { style:{ display:'flex', gap:14 } },
                        [['Proj',s.proj.toFixed(1)],['Δ',(s.mr>=0?'+':'')+s.mr.toFixed(1)],['Net',(s.net*100).toFixed(1)+'%']].map(([l,v]) =>
                          React.createElement('div', { key:l },
                            React.createElement('div', { style:{ fontSize:7, color:'#4b5563' } }, l),
                            React.createElement('div', { style:{ fontSize:13, fontWeight:700, color:'#fff' } }, v),
                          )
                        )
                      ),
                    )
                  ),
                  React.createElement('div', { style:{ padding:10, background:'#060b16', borderRadius:6, border:'1px solid #162035' } },
                    React.createElement('div', { style:{ fontSize:8, color:'#4b5563', letterSpacing:2, marginBottom:4 } }, 'OU MEAN REVERSION'),
                    React.createElement('div', { style:{ fontSize:10, color:'#6b7280' } },
                      'Dev from LR mean: ',
                      React.createElement('span', { style:{ color: CUR_DEV<0?'#10b981':'#ef4444' } }, CUR_DEV.toFixed(1)+' pts'),
                      ' · θ=0.35 · Adj: ',
                      React.createElement('span', { style:{ color:'#f59e0b' } }, (-0.35*CUR_DEV).toFixed(1)+' pts'),
                    ),
                  ),
                ]
              ),
            ),
          ),

          /* HISTORICAL */
          tab === 'historical' && React.createElement('div', null,
            React.createElement('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 } },
              card([
                secLabel('HPAT APPLICANT DEMAND (2017–2026 PROJ.)'),
                React.createElement(ResponsiveContainer, { width:'100%', height:200 },
                  React.createElement(BarChart, { data:demChart },
                    React.createElement(CartesianGrid, { strokeDasharray:'3 3', stroke:'#162035' }),
                    React.createElement(XAxis, { dataKey:'year', tick:{ fill:'#4b5563', fontSize:9 } }),
                    React.createElement(YAxis, { tick:{ fill:'#4b5563', fontSize:9 } }),
                    React.createElement(TT),
                    React.createElement(Bar, { dataKey:'v', name:'Applicants', fill:'#3b82f6', radius:[3,3,0,0] }),
                  )
                ),
              ]),
              card([
                secLabel('YOY POINTS CHANGE — 5-SCHOOL AVERAGE'),
                React.createElement(ResponsiveContainer, { width:'100%', height:200 },
                  React.createElement(BarChart, { data:deltaChart },
                    React.createElement(CartesianGrid, { strokeDasharray:'3 3', stroke:'#162035' }),
                    React.createElement(XAxis, { dataKey:'year', tick:{ fill:'#4b5563', fontSize:9 } }),
                    React.createElement(YAxis, { tick:{ fill:'#4b5563', fontSize:9 } }),
                    React.createElement(ReferenceLine, { y:0, stroke:'#3b82f6' }),
                    React.createElement(TT),
                    React.createElement(Bar, { dataKey:'delta', name:'Δ Avg Pts', fill:'#f59e0b', radius:[3,3,0,0] }),
                  )
                ),
              ]),
            ),
            card([
              secLabel('RAW DATA — MINIMUM COMBINED POINTS BY INSTITUTION'),
              React.createElement('div', { style:{ overflowX:'auto' } },
                React.createElement('table', { style:{ width:'100%', borderCollapse:'collapse', fontSize:11 } },
                  React.createElement('thead', null,
                    React.createElement('tr', { style:{ borderBottom:'1px solid #162035' } },
                      ['Year','UCD','TCD','RCSI','UCC','NUIG','Avg','YoY Δ','Notes'].map(h =>
                        React.createElement('th', { key:h, style:{ textAlign:'left', padding:'6px 8px', color:'#3b82f6', fontSize:8, letterSpacing:1 } }, h)
                      )
                    )
                  ),
                  React.createElement('tbody', null,
                    HISTORY.map((h,i) => {
                      const delta = i>0 ? h.avg - HISTORY[i-1].avg : null;
                      return React.createElement('tr', { key:h.year, style:{ borderBottom:'1px solid #0d1829', background: h.note?'#0d160d40':'transparent' } },
                        React.createElement('td', { style:{ padding:'5px 8px', fontWeight:700, color:'#fff' } }, h.year),
                        ...[h.ucd,h.tcd,h.rcsi,h.ucc,h.nuig].map((v,j) =>
                          React.createElement('td', { key:j, style:{ padding:'5px 8px', color:'#94a3b8' } }, v)
                        ),
                        React.createElement('td', { style:{ padding:'5px 8px', color:'#f59e0b', fontWeight:700 } }, h.avg),
                        React.createElement('td', { style:{ padding:'5px 8px', fontWeight:700, color: delta===null?'#4b5563': delta>0?'#ef4444':'#10b981' } },
                          delta===null ? '—' : (delta>0?'+':'')+delta.toFixed(1)
                        ),
                        React.createElement('td', { style:{ padding:'5px 8px', color:'#374151', fontSize:9 } }, h.note||'—'),
                      );
                    })
                  ),
                )
              ),
            ]),
          ),

          /* SCENARIOS */
          tab === 'scenarios' && React.createElement('div', null,
            React.createElement('div', { style:{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12, marginBottom:12 } },
              sc.map((s,i) =>
                React.createElement('div', { key:i, style:{ background:'#0a1020', border:'1px solid '+s.color, borderRadius:8, padding:18 } },
                  React.createElement('div', { style:{ fontSize:9, letterSpacing:3, color:s.color, marginBottom:12 } }, s.label.toUpperCase()+' — '+s.sub),
                  React.createElement('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:14 } },
                    [
                      ['UL Places', s.places],
                      ['Total Supply', TOTAL_PLACES+s.places],
                      ['Supply Relief', (s.relief*100).toFixed(1)+'%'],
                      ['Net Pressure', (s.net*100).toFixed(1)+'%'],
                      ['Raw Δ Pts', (s.raw>=0?'+':'')+s.raw.toFixed(1)],
                      ['MR Adj', (-0.35*CUR_DEV).toFixed(1)],
                      ['Final Δ', (s.mr>=0?'+':'')+s.mr.toFixed(1)],
                      ['Projected', s.proj.toFixed(1)],
                    ].map(([l,v]) =>
                      React.createElement('div', { key:l, style:{ padding:'7px 8px', background:'#060b16', borderRadius:4 } },
                        React.createElement('div', { style:{ fontSize:7, color:'#4b5563', letterSpacing:1, marginBottom:2 } }, l),
                        React.createElement('div', { style:{ fontSize:14, fontWeight:700, color:'#fff' } }, v),
                      )
                    )
                  ),
                  React.createElement('div', { style:{ padding:12, background:s.color+'12', borderRadius:6, textAlign:'center' } },
                    React.createElement('div', { style:{ fontSize:8, letterSpacing:2, color:s.color, marginBottom:2 } }, 'P(POINTS RISE)'),
                    React.createElement('div', { style:{ fontSize:34, fontWeight:700, color:s.color } }, Math.round(s.p*100)+'%'),
                    React.createElement('div', { style:{ fontSize:9, color:'#4b5563', marginTop:2 } },
                      s.p>0.65 ? '▲ Rise likely' : s.p>0.45 ? '→ Marginal' : '▼ Fall possible'
                    ),
                  ),
                )
              )
            ),
            card([
              secLabel('METHODOLOGY'),
              ...[
                ['Demand Model', '+'+Math.round(d*100)+'% applied to 2025 baseline 2,420 HPAT applicants → '+newApp.toLocaleString()+' projected'],
                ['Supply Relief', 'UL places as % of current national total (483). Linear offset applied to demand pressure.'],
                ['Points Sensitivity', '~1.8 combined pts per 1% net pressure. Calibrated from 2017–2020 + 2022–2025 regression. COVID 2021 excluded as structural outlier.'],
                ['Mean Reversion (OU)', 'Ornstein-Uhlenbeck θ=0.35. Current deviation from LR mean (733): '+CUR_DEV.toFixed(1)+' pts. Reversion adds '+(-0.35*CUR_DEV).toFixed(1)+' pts to raw estimate.'],
                ['Likelihood Ratio', 'Logistic sigmoid P(rise)=1/(1+e^(−8×net)). Scale k=8 calibrated to observed 710–755 historical range.'],
                ['COVID 2021 Note', '+16pt spike from accredited grades. Structural outlier — excluded from all regression and sensitivity estimates.'],
              ].map(([t,desc]) =>
                React.createElement('div', { key:t, style:{ display:'flex', gap:12, marginBottom:8 } },
                  React.createElement('div', { style:{ minWidth:130, fontSize:10, fontWeight:700, color:'#f59e0b' } }, t),
                  React.createElement('div', { style:{ fontSize:10, color:'#6b7280', lineHeight:1.6 } }, desc),
                )
              ),
            ]),
          ),

          /* LIKELIHOOD */
          tab === 'likelihood' && React.createElement('div', null,
            React.createElement('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 } },
              card([
                secLabel('P(RISE) vs P(STABLE/FALL) BY SCENARIO'),
                React.createElement(ResponsiveContainer, { width:'100%', height:200 },
                  React.createElement(BarChart, { layout:'vertical', data: sc.map(s => ({ name:s.label, rise:Math.round(s.p*100), stable:Math.round((1-s.p)*100) })) },
                    React.createElement(CartesianGrid, { strokeDasharray:'3 3', stroke:'#162035' }),
                    React.createElement(XAxis, { type:'number', domain:[0,100], tick:{ fill:'#4b5563', fontSize:9 }, unit:'%' }),
                    React.createElement(YAxis, { type:'category', dataKey:'name', tick:{ fill:'#94a3b8', fontSize:10 }, width:95 }),
                    React.createElement(TT, { formatter: v => v+'%' }),
                    React.createElement(ReferenceLine, { x:50, stroke:'#3b82f6', strokeDasharray:'4 4' }),
                    React.createElement(Bar, { dataKey:'rise', fill:'#ef4444', name:'P(Rise)', radius:[0,3,3,0] }),
                    React.createElement(Bar, { dataKey:'stable', fill:'#10b981', name:'P(Stable/Fall)', radius:[0,3,3,0] }),
                  )
                ),
              ]),
              card([
                secLabel('SUPPLY/DEMAND COMPRESSION RATIO'),
                React.createElement('div', { style:{ fontSize:10, color:'#4b5563', marginBottom:10 } }, 'Applicants per available place — higher = more pressure'),
                ...[
                  { label:'2025 Baseline', r:2420/TOTAL_PLACES, c:'#4b5563' },
                  ...sc.map(s => ({ label:s.label, r:newApp/(TOTAL_PLACES+s.places), c:s.color })),
                ].map(item =>
                  React.createElement('div', { key:item.label, style:{ display:'flex', alignItems:'center', gap:8, marginBottom:10 } },
                    React.createElement('span', { style:{ fontSize:10, color:'#94a3b8', minWidth:100 } }, item.label),
                    React.createElement('div', { style:{ flex:1, background:'#162035', borderRadius:3, height:7 } },
                      React.createElement('div', { style:{ width:Math.min(item.r/8*100,100)+'%', background:item.c, height:'100%', borderRadius:3 } })
                    ),
                    React.createElement('span', { style:{ fontSize:12, fontWeight:700, color:item.c, minWidth:36 } }, item.r.toFixed(2)+'x'),
                  )
                ),
                React.createElement('div', { style:{ padding:10, background:'#060b16', borderRadius:6, border:'1px solid #162035', marginTop:10 } },
                  React.createElement('div', { style:{ fontSize:8, color:'#4b5563', letterSpacing:2, marginBottom:6 } }, 'VERDICT MATRIX'),
                  ...sc.map((s,i) =>
                    React.createElement('div', { key:i, style:{ display:'flex', justifyContent:'space-between', padding:'4px 0', borderBottom:'1px solid #0d1829' } },
                      React.createElement('span', { style:{ fontSize:10, color:s.color } }, s.label),
                      React.createElement('span', { style:{ fontSize:10, fontWeight:700, color: s.mr>1?'#ef4444':s.mr>-1?'#f59e0b':'#10b981' } },
                        s.mr>1 ? '▲ RISE LIKELY' : s.mr>-1 ? '→ FLAT / MARGINAL' : '▼ FALL POSSIBLE'
                      ),
                    )
                  ),
                ),
              ]),
            ),
            card([
              secLabel('OUTLIER ANALYSIS — BOUNDARY CONDITIONS'),
              React.createElement('div', { style:{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:10 } },
                [
                  { label:'Bull',    desc:'+30% demand / 30 pl', d2:0.30, u2:30, c:'#ef4444' },
                  { label:'Base',    desc:'+20% demand / 50 pl', d2:0.20, u2:50, c:'#3b82f6' },
                  { label:'Bear',    desc:'+10% demand / 75 pl', d2:0.10, u2:75, c:'#10b981' },
                  { label:'Outlier', desc:'+40% demand / 30 pl', d2:0.40, u2:30, c:'#a78bfa' },
                ].map(o => {
                  const m = calc(o.d2, o.u2);
                  return React.createElement('div', { key:o.label, style:{ padding:12, border:'1px solid '+o.c, borderRadius:6, background:o.c+'07' } },
                    React.createElement('div', { style:{ fontWeight:700, color:o.c, fontSize:11, marginBottom:2 } }, o.label),
                    React.createElement('div', { style:{ fontSize:9, color:'#4b5563', marginBottom:8 } }, o.desc),
                    ...[
                      ['Net Pressure', (m.net*100).toFixed(1)+'%'],
                      ['Raw Δ Pts', (m.raw>=0?'+':'')+m.raw.toFixed(1)],
                      ['MR Δ Pts', (m.mr>=0?'+':'')+m.mr.toFixed(1)],
                      ['Projected', m.proj.toFixed(1)],
                      ['P(Rise)', Math.round(m.p*100)+'%'],
                    ].map(([l,v]) =>
                      React.createElement('div', { key:l, style:{ display:'flex', justifyContent:'space-between', fontSize:10, padding:'2px 0', borderBottom:'1px solid #0d1829' } },
                        React.createElement('span', { style:{ color:'#4b5563' } }, l),
                        React.createElement('span', { style:{ color:'#fff', fontWeight:700 } }, v),
                      )
                    ),
                  );
                })
              ),
            ]),
          ),
        ),
      );
    }
